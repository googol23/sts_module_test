[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sts-module-test"
version = "0.1.0"
description = "STS module-test result processing and pulse-scan analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.5",
    "mplhep>=0.3",
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "sts-utils>=0.1.0,<0.2.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sts-module-test-index = "module_test.index_builder:main"
sts-p-scan = "run_p_scan:main"

[tool.setuptools]
py-modules = ["run_p_scan"]

[tool.setuptools.packages.find]
where = ["."]
include = ["module_test*", "pscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
